name: Build FreeFileSync (Debian 13, aarch64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FreeFileSync version to build (e.g. 14.13)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:13

    steps:
      - name: Determine version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Building FreeFileSync version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Packages the FreeFileSync build script does not install itself and
      # which are missing from the bare debian:13 image (python3 is used by
      # the version compatibility patches, bzip2 by the wxWidgets archive,
      # perl by wx-config).
      - name: Install base packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 perl bzip2

      - uses: actions/checkout@v7

      # Compiled dependencies (libssh2, curl, wxWidgets) and previous
      # FreeFileSync builds persist between runs. The key includes the script
      # hash so dependency changes invalidate the cache.
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: build-library
          key: ffs-build-${{ hashFiles('build-freefilesync.sh') }}
          restore-keys: ffs-build-

      - name: Build FreeFileSync ${{ env.VERSION }}
        run: ./build-freefilesync.sh "${VERSION}" --no-install

      - name: Package build
        run: |
          CACHE_DIR="build-library/aarch64-debian-13/freefilesync/${VERSION}"
          if [ ! -f "${CACHE_DIR}/bin/FreeFileSync_aarch64" ]; then
            echo "Expected cached binary not found: ${CACHE_DIR}" >&2
            exit 1
          fi
          # Portable layout: binary and Resources/ side by side.
          tar -czf "FreeFileSync-${VERSION}-linux-aarch64.tar.gz" \
            --transform 's|^bin/||' \
            -C "$CACHE_DIR" bin Resources

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: FreeFileSync-${{ env.VERSION }}-linux-aarch64.tar.gz
          body: |
            Prebuilt [FreeFileSync](https://freefilesync.org) ${{ env.VERSION }}
            for Raspberry Pi OS / Debian 13 (aarch64), built automatically from
            upstream source in GitHub Actions.

            FreeFileSync is GPLv3 — source code:
            https://freefilesync.org/download/FreeFileSync_${{ env.VERSION }}_Source.zip

            ### Install

                sudo mkdir -p /opt/freefilesync
                sudo tar -xzf FreeFileSync-${{ env.VERSION }}-linux-aarch64.tar.gz -C /opt/freefilesync
                sudo chmod +x /opt/freefilesync/FreeFileSync_aarch64
                sudo ln -sf /opt/freefilesync/FreeFileSync_aarch64 /usr/local/bin/freefilesync

      - name: Upload as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: FreeFileSync-${{ env.VERSION }}-linux-aarch64
          path: FreeFileSync-${{ env.VERSION }}-linux-aarch64.tar.gz
