name: Build FreeFileSync (Debian 13, aarch64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FreeFileSync version to build (leave empty to auto-detect the latest upstream release)"
        required: false
  push:
    tags:
      - "v*"
  schedule:
    # Daily check for new upstream FreeFileSync releases
    - cron: "47 4 * * *"

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Tag pushes build exactly that tag.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual runs may request a specific version.
          REQUESTED="${{ github.event.inputs.version }}"
          if [ -n "$REQUESTED" ]; then
            echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Auto-detection: the download page states the current version
          # ("Download FreeFileSync <version>"). Skip when we already
          # published a release for it here.
          UPSTREAM="$(curl -fsSL https://freefilesync.org/download.php \
            | grep -oP 'Download FreeFileSync \K[0-9]+(\.[0-9]+)*' | head -n1)"
          if [ -z "$UPSTREAM" ]; then
            echo "Could not detect the current FreeFileSync version from the download page" >&2
            exit 1
          fi
          if gh release view "v$UPSTREAM" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Upstream $UPSTREAM is already released here - nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream release detected: $UPSTREAM"
            echo "version=$UPSTREAM" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:13
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      # Packages the FreeFileSync build script does not install itself and
      # which are missing from the bare debian:13 image (python3 is used by
      # the version compatibility patches, bzip2 by the wxWidgets archive,
      # perl by wx-config).
      - name: Install base packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 perl bzip2

      - uses: actions/checkout@v7

      # Compiled dependencies (libssh2, curl, wxWidgets) and previous
      # FreeFileSync builds persist between runs. The key includes the script
      # hash so dependency changes invalidate the cache.
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: build-library
          key: ffs-build-${{ hashFiles('build-freefilesync.sh') }}
          restore-keys: ffs-build-

      - name: Build FreeFileSync ${{ env.VERSION }}
        run: ./build-freefilesync.sh "${VERSION}" --no-install --no-prebuilt

      - name: Package build
        run: |
          CACHE_DIR="build-library/aarch64-debian-13/freefilesync/${VERSION}"
          if [ ! -f "${CACHE_DIR}/bin/FreeFileSync_aarch64" ]; then
            echo "Expected cached binary not found: ${CACHE_DIR}" >&2
            exit 1
          fi
          # Portable layout: binary and Resources/ side by side.
          tar -czf "FreeFileSync-${VERSION}-linux-aarch64.tar.gz" \
            --transform 's|^bin/||' \
            -C "$CACHE_DIR" bin Resources

      - name: Attach to GitHub Release (tag & automatic builds)
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          files: FreeFileSync-${{ env.VERSION }}-linux-aarch64.tar.gz
          body: |
            Prebuilt [FreeFileSync](https://freefilesync.org) ${{ env.VERSION }}
            for Raspberry Pi OS / Debian 13 (aarch64), built automatically from
            upstream source in GitHub Actions.

            FreeFileSync is GPLv3 — source code:
            https://freefilesync.org/download/FreeFileSync_${{ env.VERSION }}_Source.zip

            ### Install

                sudo mkdir -p /opt/freefilesync
                sudo tar -xzf FreeFileSync-${{ env.VERSION }}-linux-aarch64.tar.gz -C /opt/freefilesync
                sudo chmod +x /opt/freefilesync/FreeFileSync_aarch64
                sudo ln -sf /opt/freefilesync/FreeFileSync_aarch64 /usr/local/bin/freefilesync

      - name: Upload as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: FreeFileSync-${{ env.VERSION }}-linux-aarch64
          path: FreeFileSync-${{ env.VERSION }}-linux-aarch64.tar.gz
